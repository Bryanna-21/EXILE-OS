name: Label Workflows

on:
  pull_request:
    types: [ labeled, opened, synchronize, reopened ]

jobs:
  Coverage:
    if: github.repository == 'Bryanna-21/EXILE-OS' && contains(github.event.pull_request.labels.*.name, '📑 pr-run-coverage-build')
    uses: ./.github/workflows/exile-template.yml
    with:
      toolchain: 'Clang'
      os: ubuntu-24.04
      arch: 'x86_64'
      coverage: 'ON'
