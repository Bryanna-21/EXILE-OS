# EXILE OS - Living Battlefield settings (all local, no network)
[Time]
# Real seconds for one full 24h simulated day (default 30 min)
cycle_seconds=1800
speed=1
# 6 = dawn
start_hour=6
# true = follow the machine's local clock instead of the accelerated cycle
realtime=false
paused=false

[Render]
width=1920
height=1080
fps=30
# true = 15 fps
low_power=false
# internal render scale (output is stretched to width x height)
render_scale=0.6
threads=2

[Effects]
grain=true
bloom=true
seed=20261022
