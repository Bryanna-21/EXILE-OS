name: Repository Repairs

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  repair:
    name: Run Repairs & Diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Repository Diagnostics & Fixes
        shell: bash
        run: |
          set -uo pipefail

          echo "=== 1. Checking Python Syntax ==="
          python3 -m compileall -q ExileKernel/scripts

          echo "=== 2. Running EUK Audit ==="
          python3 ExileKernel/scripts/audit.py

          echo "=== 3. Validating Shell Scripts ==="
          while IFS= read -r -d "" target_file; do
            bash -n "$target_file"
          done < <(find . -name "*.sh" -not -path "./Ports/*" -not -path "*/Tests/LibShell/*" -not -path "*/Base/usr/share/Shell/*" -not -path "./Base/root/generate_manpages.sh" -not -path "./Base/home/anon/Tests/*" -print0)

          echo "Repository diagnostics and repairs check completed successfully."
